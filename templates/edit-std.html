
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
</head>
<body>

    <h2>Edit Student {{ std[1] }}</h2>

    <form action="/students/edit/{{std[0]}}" method="post">

        <label>Name:</label>
        <input type="text" name="name" required value="{{std[1]}}">
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" required value="{{std[2]}}">
        <br><br>
        <label>Gender:</label>
        <input type="text" name="gender" required value="{{std[3]}}">
        <br><br>
        <label>Marks:</label>
        <input type="number" name="marks" required value="{{std[4]}}">
        <br><br>

        <label>Course:</label>
        <input type="text" name="course" required value="{{std[5]}}">
        <br><br>

        <label>Image:</label>
        <input type="text" name="image" required value="{{std[6]}}">
        <br><br>

        <label>Attendance:</label>
        <select name="status">
            <option value="1" {% if std[7] == 1 %}selected{% endif %}>Present</option>
            <option value="0" {% if std[7] == 0 %}selected{% endif %}>Absent</option>
        </select>

        <br><br>

        <button type="submit">Update Student</button>

    </form>

</body>
</html>
